<div class="row no-margin h-100 main-container">
    <div class="col-12 row no-margin visualization-options-div">
        <app-twin-options (liveReloadEvent)="liveReload($event)" class="w-100 h-100"></app-twin-options>
    </div>
    <div class="col-12 row no-margin h-100" *ngFor="let twin of twinNames">
        <div class="col-12 h-100">
            <div echarts [options]="options[twin]" class="demo-chart h-100" class="chart"></div>
        </div>
        <!-- <div class="col-6">
            <div echarts [options]="options1" class="demo-chart" class="chart"></div>
        </div> -->
    </div>
</div>
