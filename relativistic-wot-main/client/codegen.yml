overwrite: true
schema: "https://api-staging.luzzigruppielettrogeni.com/graphql"
documents: "src/**/*.graphql"
generates:
  src/app/graphql/generated/graphql.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typescript-apollo-angular"
  ./graphql.schema.json:
    plugins:
      - "introspection"
